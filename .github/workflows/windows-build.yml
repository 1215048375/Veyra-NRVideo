name: Windows build

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Build Veyra.exe (requires the private CI dependency bundle)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  source-checks:
    name: Compile UI and run CPU tests
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile playlist UI and both application variants; run tests
        run: ./scripts/acceptance/playlist.ps1 -Root $env:GITHUB_WORKSPACE
      - name: Explain validation scope
        if: always()
        run: |
          'Source checks compile AppShell with/without Remote Play and run playlist/UI tests. They do not build the complete player or validate GPU playback.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload test logs only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-source-checks-${{ github.run_id }}
          path: out/playlist/acceptance-*.log
          if-no-files-found: warn
          retention-days: 7

  full-build:
    name: Build complete application (private dependencies)
    needs: source-checks
    if: github.event_name == 'workflow_dispatch' && inputs.full_build && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2022
    timeout-minutes: 60
    environment: windows-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch verified private development dependencies
        env:
          VEYRA_CI_DEPS_URL: ${{ secrets.VEYRA_CI_DEPS_URL }}
          VEYRA_CI_DEPS_SHA256: ${{ secrets.VEYRA_CI_DEPS_SHA256 }}
        run: ./scripts/ci/prepare-dependencies.ps1
      - name: Configure and compile full application
        run: ./scripts/ci/build-windows.ps1
      - name: Upload application files (no runtime pack)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Veyra-win64-build-${{ github.sha }}
          path: out/ci-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Explain validation scope
        if: always()
        run: |
          'Full build requires a private, SHA-256 verified development bundle. Artifact contains application/shaders/notices only, not a portable Runtime Pack. No NR/FG execution, GPU/PS5 acceptance or Release publishing is performed.' >> $env:GITHUB_STEP_SUMMARY
